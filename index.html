<style>
html,body{margin:0!important;padding:0!important;background:#050505!important;overflow-x:hidden}
#itu-theme,#itu-theme *{box-sizing:border-box;cursor:none!important}
#itu-theme{width:100%;min-height:100vh;line-height:1.4;--theme-bg:linear-gradient(145deg,#281323,#55213c,#783c38);--theme-panel:linear-gradient(135deg,#55253e,#713d39,#3d2444);--theme-accent:#ffc28c;--theme-accent2:#ff9eae;--theme-border:#d77d7d;--theme-glow:#ff8a78;--theme-soft:#713b48}
#itu-cookie-cursor{position:fixed;z-index:2147483647;pointer-events:none;display:none;font-size:25px;transform:translate(3px,3px);filter:drop-shadow(0 0 6px var(--cursor-glow,#d7a56b))}

.cookie-crumb{position:fixed;z-index:2147483646;pointer-events:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe4a8 0 15%,#d99a50 38%,#a96832 75%);box-shadow:0 0 5px rgba(221,166,94,.5);animation:crumbFade .7s ease-out forwards}
@keyframes crumbFade{0%{opacity:.95;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--crumb-x),var(--crumb-y)) scale(.15)}}

#itu-theme button{font-family:Arial,sans-serif;transition:all .22s ease}
#itu-theme button[data-hover-button]:hover{transform:translateY(-2px);filter:brightness(1.2);box-shadow:0 0 16px var(--theme-glow),0 0 28px var(--theme-glow)}
#itu-theme .theme-button{display:block;width:100%;background:linear-gradient(135deg,var(--theme-panel),var(--theme-soft));color:var(--theme-accent);border:1px solid var(--theme-border);border-radius:9px;padding:12px;font-weight:bold;letter-spacing:2px;box-shadow:0 0 10px var(--theme-glow)}
#itu-theme .itu-cat-rain{position:absolute;top:-40px;z-index:9999;pointer-events:none;animation:cookieFall linear forwards}
@keyframes cookieFall{0%{transform:translateY(-30px) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(750px) rotate(360deg);opacity:0}}

#itu-theme .preview-header{text-align:center;padding:32px 5px 27px;margin-bottom:12px;width:100%;overflow:hidden}
#itu-theme .preview-title{display:block;width:100%;font-size:clamp(38px,9vw,55px);font-weight:1000;letter-spacing:9px;line-height:1.2;color:var(--theme-accent);text-align:center;text-shadow:0 0 5px var(--theme-accent),0 0 12px var(--theme-glow),0 0 25px var(--theme-glow),0 0 45px var(--theme-glow);overflow-wrap:anywhere}
#itu-theme .preview-underline{width:105px;height:3px;margin:17px auto 0;background:linear-gradient(90deg,transparent,var(--theme-accent),var(--theme-accent2),transparent);box-shadow:0 0 12px var(--theme-glow);border-radius:5px}

#itu-theme .hawk-profile{text-align:center;padding:14px 8px;margin-bottom:12px;border:1px solid var(--theme-border);border-radius:11px;background:var(--theme-panel);overflow:hidden}
#itu-theme .hawk-avatar-wrap{width:78px;height:78px;margin:10px auto;border-radius:50%;padding:3px;background:var(--theme-border);box-shadow:0 0 9px var(--theme-glow);transition:all .25s}
#itu-theme .hawk-avatar-wrap:hover,#itu-theme .watch-avatar-wrap:hover{transform:scale(1.08);filter:brightness(1.2);box-shadow:0 0 16px var(--theme-glow),0 0 28px var(--theme-glow)}

#itu-theme .member-counter{background:var(--theme-panel);border:1px solid var(--theme-border);border-radius:11px;padding:17px 12px;margin:12px 0;text-align:center}

#itu-theme .new-member-avatar img{width:100%;height:100%;object-fit:cover;display:block}
#itu-theme .new-member-info{min-width:0;flex:1}
#itu-theme .new-member-name{font-size:12px;font-weight:900;color:#fff;overflow-wrap:anywhere}

/* SINGLE MOVING BORDER GLOW */
@property --itu-border-angle {
  syntax: "<angle>";
  inherits: false;
  initial-value: 0deg;
}

#itu-theme::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:14px;
  padding:1.5px;
  pointer-events:none;
  z-index:50;
  background:conic-gradient(
    from var(--itu-border-angle),
    transparent 0deg 315deg,
    var(--theme-accent) 332deg,
    var(--theme-glow) 342deg,
    var(--theme-accent2) 350deg,
    transparent 360deg
  );
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;
  animation:itu-border-travel 3.8s linear infinite;
}

@keyframes itu-border-travel{
  to{--itu-border-angle:360deg}
}

@media (prefers-reduced-motion:reduce){
  #itu-theme::after{animation:none!important}
}
</style>

<script>
(function(){
var theme=document.getElementById('itu-theme');

/* COOKIE CURSOR */
var cursor=document.createElement('span');
cursor.id='itu-cookie-cursor';
cursor.textContent='🍪';
document.body.appendChild(cursor);

document.addEventListener('mousemove',function(e){
if(theme&&theme.contains(e.target)){
cursor.style.display='block';
cursor.style.left=e.clientX+'px';
cursor.style.top=e.clientY+'px';
}else{cursor.style.display='none'}
});

/* COOKIE CRUMB TRAIL */
var lastX=null,lastY=null,lastTime=0;
document.addEventListener('mousemove',function(e){
if(!theme||!theme.contains(e.target)){lastX=null;lastY=null;return}
var now=Date.now();
if(lastX===null){lastX=e.clientX;lastY=e.clientY;lastTime=now;return}
var dx=e.clientX-lastX,dy=e.clientY-lastY;
var distance=Math.sqrt(dx*dx+dy*dy);
if(distance<9||now-lastTime<35)return;

var crumb=document.createElement('span');
crumb.className='cookie-crumb';
var size=3+Math.random()*5;
crumb.style.width=size+'px';
crumb.style.height=size+'px';
crumb.style.left=(e.clientX+(Math.random()*10-5))+'px';
crumb.style.top=(e.clientY+(Math.random()*10-5))+'px';
crumb.style.setProperty('--crumb-x',(Math.random()*24-12)+'px');
crumb.style.setProperty('--crumb-y',(8+Math.random()*18)+'px';
document.body.appendChild(crumb);
setTimeout(function(){crumb.remove()},750);

lastX=e.clientX;lastY=e.clientY;lastTime=now;
});

/* LOAD PROFILE PICTURES */
function loadAvatar(username,imageId,fallbackId,letter){
var avatar=document.getElementById(imageId);
var fallback=document.getElementById(fallbackId);
fetch('https://api.chess.com/pub/player/'+username)
.then(function(r){if(!r.ok)throw Error();return r.json()})
.then(function(profile){
if(profile.avatar){
avatar.onload=function(){avatar.style.display='block';fallback.style.display='none'};
avatar.onerror=function(){avatar.style.display='none';fallback.style.display='block'};
avatar.src=profile.avatar;
}
}).catch(function(){fallback.textContent=letter});
}

loadAvatar('i-am-hawk','hawk-live-avatar','hawk-avatar-fallback','H');
loadAvatar('watchandlearn101','watch-live-avatar','watch-avatar-fallback','W');
loadAvatar('lowkbadmove','lowk-live-avatar','lowk-avatar-fallback','L');

/* PREVIEW MEMBER AVATARS */
function loadPreviewAvatar(username,id,letter){
var box=document.getElementById(id);
fetch('https://api.chess.com/pub/player/'+username)
.then(function(r){if(!r.ok)throw Error();return r.json()})
.then(function(profile){
if(profile.avatar){
var img=document.createElement('img');
img.alt=username;
img.src=profile.avatar;
img.onerror=function(){box.textContent=letter};
box.textContent='';
box.appendChild(img);
}
}).catch(function(){box.textContent=letter});
}

loadPreviewAvatar('magnuscarlsen','preview-avatar-magnus','M');
loadPreviewAvatar('hikaru','preview-avatar-hikaru','H');
loadPreviewAvatar('gothamchess','preview-avatar-gothamchess','G');

})();
</script>
